name: Deploy to Cloudflare

# Every push to main rebuilds the site and deploys it to Cloudflare.
# Needs one repository secret: CLOUDFLARE_API_TOKEN (see README → Deploying).
# Until that secret exists, the run is skipped with a warning instead of failing.

on:
  push:
    branches: [main]
  workflow_dispatch: # "Run workflow" button in the Actions tab

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Token missing — skipping deploy
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::warning::Add the CLOUDFLARE_API_TOKEN repository secret to enable auto-deploy."

      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != ''

      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 24
          cache: npm

      - name: Install
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm ci

      - name: Build and deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm run deploy
